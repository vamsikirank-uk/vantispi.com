<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient (Dark Obsidian Glass) -->
    <linearGradient id="appleSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="15%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Rim Gradient (Cyan to Emerald) -->
    <linearGradient id="neonRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#05DF85" />
    </linearGradient>

    <!-- T-Cyan Gradient (Electric Cyan) -->
    <linearGradient id="tCyanGrad" gradientUnits="userSpaceOnUse" x1="29" y1="42" x2="61" y2="86">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- D-Emerald Gradient (Neon Mint / Emerald) -->
    <linearGradient id="dEmeraldGrad" gradientUnits="userSpaceOnUse" x1="61" y1="42" x2="103" y2="86">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#05DF85" />
    </linearGradient>

    <!-- Specular Glass Highlight Gradient -->
    <linearGradient id="glassReflection" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Outer Neon Glow Under the Icon -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="none" stroke="url(#neonRimGrad)" stroke-width="6" opacity="0.45" filter="url(#rimGlow)" />

  <!-- Base Apple App Icon Squircle (Straight, 0° tilt) -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#appleSquircleBg)" stroke="url(#neonRimGrad)" stroke-width="2.5" />

  <!-- Apple Glass Specular Curvature Highlight -->
  <path d="M14 38C14 24 24 14 38 14H90C104 14 114 24 114 38C114 44 95 56 64 56C33 56 14 44 14 38Z" fill="url(#glassReflection)" />

  <!-- TD Monogram (Straight, Not Inclined, Exact Letter Design, Perfectly Centered) -->
  <g id="straightTDGroup" filter="url(#glyphGlow)">
    <!-- Letter 'T': Straight Horizontal Crossbar & Straight Vertical Stem -->
    <path d="M29 42H61 M45 42V86" stroke="url(#tCyanGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter 'D': Outer Arc + Inner Concentric Arc -->
    <!-- D Outer Bold Arc -->
    <path d="M61 42H73C87 42 99 52 99 64C99 76 87 86 73 86H61" stroke="url(#dEmeraldGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- D Inner Concentric Arc -->
    <path d="M62 54H70C77 54 84 58.5 84 64C84 69.5 77 74 70 74H62" stroke="url(#dEmeraldGrad)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
